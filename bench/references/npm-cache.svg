<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="npm-deps-cache-title npm-deps-cache-desc">
      <title id="npm-deps-cache-title">How caiq-npm-install fills node_modules</title>
      <desc id="npm-deps-cache-desc">Swimlane showing the worker reporting its Node runtime, a script in the Hermes container hashing the dependency inputs, then either copying a stored snapshot into the worktree on a hit, or running npm ci in the worker on a miss and copying the result into the store before evicting old snapshots.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="72" x2="832" y2="72" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="164" x2="832" y2="164" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="256" x2="832" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="348" x2="832" y2="348" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="160" y1="72" x2="160" y2="348" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="52" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WORKER</text>
      <text x="52" y="130" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">run_project_cmd</text>
      <text x="52" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HERMES</text>
      <text x="52" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">npm_deps.py</text>
      <text x="52" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STORE</text>
      <text x="52" y="314" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">.node-modules/</text>

      <!-- Arrows (drawn before boxes) -->
      <!-- A → B: runtime string -->
      <path d="M244,144 V204 Q244,212 252,212 H346" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B → C: hit -->
      <path d="M476,212 H514" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- B → D: miss -->
      <path d="M412,188 V128 Q412,120 420,120 H514" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- S → C: read snapshot -->
      <path d="M560,280 V238" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- D → E: npm ci succeeded -->
      <path d="M644,120 H740 Q748,120 748,128 V186" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E → S: write snapshot -->
      <path d="M716,236 V252 Q716,260 708,260 H612 Q604,260 604,268 V278" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E → F: evict -->
      <path d="M780,236 V278" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="252" y="160" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="276" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUNTIME</text>
      <rect x="482" y="192" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="201" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>
      <rect x="448" y="100" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="466" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>
      <rect x="508" y="250" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="259" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>
      <rect x="666" y="100" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 0</text>
      <rect x="652" y="240" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="674" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <!-- Worker: read runtime -->
      <rect x="180" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="96" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="244" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read runtime</text>
      <text x="244" y="133" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">node -p …</text>

      <!-- Worker: npm ci -->
      <rect x="516" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="516" y="96" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">npm ci</text>
      <text x="580" y="133" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~27 s on k8s</text>

      <!-- Hermes: hash inputs -->
      <rect x="348" y="188" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="348" y="188" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="412" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hash inputs</text>
      <text x="412" y="225" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restore → key</text>

      <!-- Hermes: copy in (focal) -->
      <rect x="516" y="188" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="516" y="188" width="128" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="580" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copy in</text>
      <text x="580" y="225" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cp -a · 3.5 s</text>

      <!-- Hermes: copy out -->
      <rect x="684" y="188" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="188" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="748" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copy out</text>
      <text x="748" y="225" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">save · tmp+rename</text>

      <!-- Store: snapshot -->
      <rect x="516" y="280" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="516" y="280" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="580" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Snapshot</text>
      <text x="580" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;key&gt;/ · 1.4 GB</text>

      <!-- Store: evict -->
      <rect x="684" y="280" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="280" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="748" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evict</text>
      <text x="748" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&gt;90 d · over cap</text>

      <!-- Legend -->
      <line x1="40" y1="372" x2="832" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="40" y="398" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="406" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
      <rect x="112" y="398" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="132" y="406" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stored on disk</text>
      <rect x="236" y="398" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <line x1="256" y1="403" x2="284" y2="403" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="292" y="406" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Hit path</text>
      <line x1="364" y1="403" x2="392" y2="403" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="400" y="406" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Miss path</text>
    </svg>