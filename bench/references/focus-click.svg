<svg class="diagram" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pulse-seq-title pulse-seq-desc">
    <title id="pulse-seq-title">Focus pulse click flow</title>
    <desc id="pulse-seq-desc">Sequence showing the directive registering a pulse callback at render time, and form-status calling it on click, which pulses either the form field's input container or the element's parent before the input is focused.</desc>
    <defs>
      <marker id="s-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="s-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="s-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- lifelines -->
    <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3">
      <line x1="110" y1="76" x2="110" y2="600"/>
      <line x1="300" y1="76" x2="300" y2="600"/>
      <line x1="490" y1="76" x2="490" y2="600"/>
      <line x1="680" y1="76" x2="680" y2="600"/>
      <line x1="870" y1="76" x2="870" y2="600"/>
    </g>

    <!-- phase markers -->
    <text x="30" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ON RENDER</text>
    <line x1="30" y1="228" x2="970" y2="228" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="30" y="248" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ON CLICK</text>

    <!-- alt fragment -->
    <rect x="462" y="340" width="436" height="160" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <rect x="462" y="340" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <text x="482" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
    <text x="474" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[inside a form field]</text>
    <line x1="470" y1="444" x2="890" y2="444" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="474" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else]</text>

    <!-- activation bars -->
    <rect x="106" y="256" width="8" height="332" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="486" y="320" width="8" height="164" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="676" y="400" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="866" y="424" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

    <!-- messages -->
    <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle">
      <!-- m1 inject -->
      <line x1="490" y1="120" x2="678" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="549" y="100" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="585" y="109" fill="#7a8399">INJECT (OPT)</text>
      <!-- m2 addControl -->
      <line x1="490" y1="160" x2="302" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="362" y="140" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="395" y="149" fill="#7a8399">ADD CONTROL</text>
      <!-- m3 errors$ -->
      <line x1="300" y1="200" x2="112" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#s-arrow-open)"/>
      <rect x="181" y="180" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="205" y="189" fill="#7a8399">ERRORS$</text>
      <!-- m4 self: sleep + scroll -->
      <path d="M114,264 H150 Q158,264 158,272 V276 Q158,284 150,284 H116" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="164" y="268" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="202" y="277" fill="#7a8399">SLEEP · SCROLL</text>
      <!-- m5 call callback -->
      <line x1="114" y1="320" x2="484" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="177" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="205" y="309" fill="#7a8399">PLAY PULSE</text>
      <!-- m6 form field pulse -->
      <line x1="494" y1="400" x2="674" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="557" y="380" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="585" y="389" fill="#7a8399">PLAY PULSE</text>
      <!-- m7 container -->
      <line x1="684" y1="424" x2="864" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="749" y="404" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="775" y="413" fill="#7a8399">CONTAINER</text>
      <!-- m8 parent -->
      <line x1="494" y1="480" x2="864" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="547" y="460" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="585" y="469" fill="#7a8399">PARENT ELEMENT</text>
      <!-- m9 return -->
      <line x1="866" y1="532" x2="116" y2="532" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#s-arrow)"/>
      <rect x="740" y="512" width="70" height="12" rx="2" fill="#f5f5f5"/>
      <text x="775" y="521" fill="#7a8399">ANIMATION END</text>
      <!-- m10 focus (headline) -->
      <path d="M114,560 H150 Q158,560 158,568 V572 Q158,580 150,580 H116" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#s-arrow-accent)"/>
      <rect x="164" y="564" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="573" fill="#eb6c36">FOCUS(INPUT)</text>
    </g>

    <!-- actors -->
    <g font-family="'Geist', sans-serif">
      <rect x="30" y="24" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="30" y="24" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="48" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Form-status</text>
      <text x="110" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">form-status.component</text>

      <rect x="220" y="24" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="24" width="160" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="300" y="48" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Error aggregation</text>
      <text x="300" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ControlError store</text>

      <rect x="410" y="24" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="410" y="24" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="48" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Aggregate-errors</text>
      <text x="490" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">directive on the input</text>

      <rect x="600" y="24" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="24" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="48" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Form field</text>
      <text x="680" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tetra-base-form-field</text>

      <rect x="790" y="24" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="790" y="24" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="870" y="48" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Pulse function</text>
      <text x="870" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">playFocusPulseOn()</text>
    </g>

    <!-- legend -->
    <line x1="30" y1="612" x2="970" y2="612" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
      <text x="30" y="640" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="637" x2="150" y2="637" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <text x="158" y="640">CALL</text>
      <line x1="230" y1="637" x2="270" y2="637" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#s-arrow)"/>
      <text x="278" y="640">RETURN</text>
      <line x1="360" y1="637" x2="400" y2="637" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#s-arrow-open)"/>
      <text x="408" y="640">OBSERVABLE EMIT</text>
      <line x1="530" y1="637" x2="570" y2="637" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#s-arrow-accent)"/>
      <text x="578" y="640">WHAT THE USER GETS</text>
    </g>
  </svg>