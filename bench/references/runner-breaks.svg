<svg viewBox="0 0 1000 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runner-breaks-title runner-breaks-desc">
        <title id="runner-breaks-title">Starting the app in one call and testing in the next</title>
        <desc id="runner-breaks-desc">Sequence showing ng serve blocking its call until Hermes gives up at 420 seconds, a later Cypress call failing in a separate worker with no app on port 4444, and the runner killing and removing the ng serve worker at 900 seconds.</desc>
        <defs>
          <marker id="b-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="b-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="b-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- LIFELINES: 100 agent, 340 runner, 580 test worker, 820 default worker -->
        <line x1="100" y1="80" x2="100" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="340" y1="80" x2="340" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="580" y1="80" x2="580" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="820" y1="80" x2="820" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="96" y="116" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="96" y="276" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="336" y="116" width="8" height="448" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="344" y="276" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="576" y="316" width="8" height="92" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="816" y="156" width="8" height="408" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <line x1="104" y1="120" x2="336" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#b-arrow-link)"/>
        <line x1="344" y1="160" x2="816" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b-arrow)"/>
        <path d="M 104 200 L 128 200 A 8 8 0 0 1 136 208 L 136 224 A 8 8 0 0 1 128 232 L 102 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b-arrow)"/>
        <line x1="104" y1="280" x2="336" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#b-arrow-link)"/>
        <line x1="352" y1="320" x2="576" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b-arrow)"/>
        <path d="M 584 344 L 608 344 A 8 8 0 0 1 616 352 L 616 368 A 8 8 0 0 1 608 376 L 586 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b-arrow)"/>
        <line x1="576" y1="404" x2="352" y2="404" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#b-arrow)"/>
        <line x1="336" y1="440" x2="104" y2="440" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#b-arrow)"/>
        <path d="M 344 488 L 368 488 A 8 8 0 0 1 376 496 L 376 512 A 8 8 0 0 1 368 520 L 346 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b-arrow)"/>
        <line x1="344" y1="560" x2="816" y2="560" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#b-arrow-accent)"/>

        <!-- LABELS -->
        <rect x="182" y="100" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN NG SERVE</text>
        <rect x="660" y="140" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="700" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXEC NG SERVE</text>
        <rect x="144" y="210" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="192" y="219" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">420 S · GIVES UP</text>
        <rect x="186" y="260" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="269" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN CYPRESS</text>
        <rect x="424" y="300" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATE + EXEC</text>
        <rect x="624" y="354" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="670" y="363" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO APP ON :4444</text>
        <rect x="442" y="384" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXIT 1</text>
        <rect x="186" y="420" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEST FAILED</text>
        <rect x="384" y="498" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="424" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">900 S TIMEOUT</text>
        <rect x="660" y="540" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="700" y="549" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KILL + REMOVE</text>

        <!-- ACTORS -->
        <rect x="28" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="28" y="24" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="36" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="50" y="41" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
        <text x="100" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hermes agent</text>
        <text x="100" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_project_cmd</text>

        <rect x="268" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="268" y="24" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="276" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="290" y="41" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="340" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runner</text>
        <text x="340" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/run · docker exec</text>

        <rect x="508" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="508" y="24" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="516" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="530" y="41" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WKR</text>
        <text x="580" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Test worker</text>
        <text x="580" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linux-cypress:15</text>

        <rect x="748" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="748" y="24" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="756" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="770" y="41" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WKR</text>
        <text x="820" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Default worker</text>
        <text x="820" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linux-nodejs:24</text>

        <!-- LEGEND -->
        <line x1="28" y1="616" x2="972" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="28" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="28" y="644" width="4" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="40" y="655" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Waiting, or process running</text>
        <line x1="196" y1="652" x2="224" y2="652" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#b-arrow-link)"/>
        <text x="232" y="655" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>
        <line x1="292" y1="652" x2="320" y2="652" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b-arrow)"/>
        <text x="328" y="655" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Docker API call or timer</text>
        <line x1="460" y1="652" x2="488" y2="652" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#b-arrow)"/>
        <text x="496" y="655" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
        <line x1="564" y1="652" x2="592" y2="652" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#b-arrow-accent)"/>
        <text x="600" y="655" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Where the app dies</text>
      </svg>