        <text x="385" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATE + EXEC</text>
        <rect x="524" y="422" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="562" y="431" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVE + TEST</text>
        <rect x="727" y="468" width="76" height="12" rx="2" fill="#f5f5f5"/>
