        <text x="670" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Default worker</text>
        <text x="670" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linux-nodejs:24</text>

        <rect x="788" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="788" y="24" width="144" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="796" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="810" y="41" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="860" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tetra server</text>
        <text x="860" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">network tetra</text>

        <!-- LEGEND -->
        <line x1="28" y1="656" x2="972" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="28" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="28" y="684" width="4" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
