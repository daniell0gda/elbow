        <text x="100" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_project_cmd</text>

        <rect x="218" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="218" y="24" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="226" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
