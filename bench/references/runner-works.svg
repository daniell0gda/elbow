        <text x="195" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN NPM CI</text>
        <rect x="535" y="140" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="575" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATE WORKER</text>
