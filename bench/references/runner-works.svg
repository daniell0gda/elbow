        <rect x="747" y="508" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="765" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
