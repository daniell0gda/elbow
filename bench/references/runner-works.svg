        <rect x="173" y="260" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="195" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
        <rect x="157" y="316" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="195" y="325" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN TEST:E2E</text>
