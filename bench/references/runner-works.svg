        <line x1="208" y1="692" x2="236" y2="692" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#w-arrow-link)"/>
        <text x="244" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>
        <line x1="304" y1="692" x2="332" y2="692" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#w-arrow)"/>
        <text x="340" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Docker API call</text>
