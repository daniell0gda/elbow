<svg viewBox="0 0 1000 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runner-works-title runner-works-desc">
        <title id="runner-works-title">Build and end-to-end test through the runner</title>
        <desc id="runner-works-desc">Sequence showing the Hermes agent running npm ci in the default worker, then one end-to-end command in a second test-image worker that serves the app, calls the Tetra server and exits.</desc>
        <defs>
          <marker id="w-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="w-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="w-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- LIFELINES: 100 agent, 290 runner, 480 test worker, 670 default worker, 860 tetra -->
        <line x1="100" y1="80" x2="100" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="290" y1="80" x2="290" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="80" x2="480" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="670" y1="80" x2="670" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="860" y1="80" x2="860" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="96" y="116" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="96" y="332" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="286" y="116" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="286" y="332" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
