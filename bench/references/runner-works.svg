        <rect x="476" y="372" width="8" height="200" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="856" y="484" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <line x1="104" y1="120" x2="286" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#w-arrow-link)"/>
        <line x1="294" y1="160" x2="666" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#w-arrow)"/>
        <line x1="294" y1="200" x2="666" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#w-arrow)"/>
