<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where the coupling is</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Component · Focus pulse</p>
    <h1>Where the coupling is</h1>

    <svg viewBox="0 0 1040 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="focus-coupling-title focus-coupling-desc">
      <title id="focus-coupling-title">Where the coupling is</title>
      <desc id="focus-coupling-desc">Component diagram showing how the focus pulse couples form status, error aggregation and form fields through the aggregate-errors service, which drives the pulse function and its styles.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <g fill="none" stroke="#4f5d75">
        <path d="M220,104 H560" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M172,160 V256 Q172,264 180,264 H300" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M420,240 V144 Q420,136 428,136 H560" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M340,320 V416 Q340,424 332,424 H220" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M124,400 V304 Q124,296 132,296 H300" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M480,280 H640 Q648,280 648,288 V400" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M220,456 H560" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M740,440 H820" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M910,320 V400" stroke-width="1.2" marker-end="url(#arrow)"/>
      </g>

      <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" text-anchor="middle" letter-spacing="0.06em">
        <rect x="364" y="84" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="93">ERRORS$</text>

        <rect x="180" y="194" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="216" y="203">RUNTIME CALL</text>

        <rect x="456" y="116" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="125">ADD CONTROL</text>

        <rect x="264" y="354" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="298" y="363">CONCRETE DI</text>

        <rect x="132" y="342" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="160" y="351">INJECTOR</text>

        <rect x="532" y="260" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="556" y="269">PARENT</text>

        <rect x="356" y="436" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="445">CONTAINER</text>

        <rect x="750" y="420" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="429">CLASS NAME</text>

        <rect x="918" y="354" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="942" y="363">@IMPORT</text>
      </g>

      <!-- Form-status (client) -->
      <rect x="40" y="80" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="80" width="180" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="86" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="68" y="95" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="130" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Form-status</text>
      <text x="130" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error.playFocusPulse?.()</text>

      <!-- Error aggregation (service) -->
      <rect x="560" y="80" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="80" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="86" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="590" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="650" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Error aggregation</text>
      <text x="650" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ControlError.playFocusPulse</text>

      <!-- Aggregate-errors (focal service) -->
      <rect x="300" y="240" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="240" width="180" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="308" y="246" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="330" y="255" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="390" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aggregate-errors</text>
      <text x="390" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decides what pulses</text>

      <!-- Base global styles (external) -->
      <rect x="820" y="240" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="820" y="240" width="180" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="828" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="842" y="255" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="910" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Base global styles</text>
      <text x="910" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">styles.less · app imports</text>

      <!-- Form field (client) -->
      <rect x="40" y="400" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="400" width="180" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="406" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="68" y="415" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="130" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Form field</text>
      <text x="130" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">playFocusPulse()</text>

      <!-- Pulse function (service) -->
      <rect x="560" y="400" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="400" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="406" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="590" y="415" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="650" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pulse function</text>
      <text x="650" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">forms/focus-pulse.ts</text>

      <!-- Pulse styles (store) -->
      <rect x="820" y="400" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="820" y="400" width="180" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="828" y="406" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="846" y="415" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="910" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pulse styles</text>
      <text x="910" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">forms/focus-pulse.less</text>

      <!-- Legend -->
      <line x1="30" y1="516" x2="1010" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">
        <text x="30" y="544" letter-spacing="0.14em">LEGEND</text>

        <rect x="100" y="536" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="124" y="544">focal</text>

        <rect x="196" y="536" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="220" y="544">client</text>

        <rect x="296" y="536" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="544">service</text>

        <rect x="404" y="536" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="428" y="544">style store</text>

        <rect x="532" y="536" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="556" y="544">external</text>

        <line x1="648" y1="541" x2="676" y2="541" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="684" y="544">call</text>

        <line x1="740" y1="541" x2="768" y2="541" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="776" y="544">async / reply</text>
      </g>
    </svg>
  </div>
</body>
</html>
