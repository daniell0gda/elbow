<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a worktree's node_modules comes from · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>Where a worktree's node_modules comes from</h1>

    <svg viewBox="0 0 1120 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="npm-cache-title npm-cache-desc">
      <title id="npm-cache-title">Where a worktree's node_modules comes from</title>
      <desc id="npm-cache-desc">Swimlane diagram showing how Hermes hashes the worker's runtime into a cache key, copies a stored snapshot into the worktree on a hit, and on a miss runs npm ci on the worker and saves the result to the store, which evicts old snapshots.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="64" x2="1080" y2="64" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="192" x2="1080" y2="192" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="320" x2="1080" y2="320" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="448" x2="1080" y2="448" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="144" y1="64" x2="144" y2="448" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="40" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WORKER</text>
      <text x="40" y="138" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">run_project_cmd</text>
      <text x="40" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HERMES</text>
      <text x="40" y="266" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">npm_deps.py</text>
      <text x="40" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STORE</text>
      <text x="40" y="394" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">.node-modules/</text>

      <!-- Arrows (drawn before nodes) -->
      <path d="M 232 152 V 248 A 8 8 0 0 0 240 256 H 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="496" y1="256" x2="544" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 424 232 V 136 A 8 8 0 0 1 432 128 H 544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 688 128 H 800 A 8 8 0 0 1 808 136 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="808" y1="280" x2="808" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 736 384 H 624 A 8 8 0 0 1 616 376 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 880 256 H 992 A 8 8 0 0 1 1000 264 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="268" y="236" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUNTIME</text>

      <rect x="506" y="236" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>

      <rect x="456" y="108" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="117" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>

      <rect x="720" y="108" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="117" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 0</text>

      <rect x="816" y="314" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="323" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <rect x="660" y="364" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <!-- Worker: Read runtime -->
      <rect x="160" y="104" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="104" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="125" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read runtime</text>
      <text x="232" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">node -p …</text>

      <!-- Worker: npm ci -->
      <rect x="544" y="104" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="104" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="616" y="125" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">npm ci</text>
      <text x="616" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~27 s on k8s</text>

      <!-- Hermes: Hash inputs -->
      <rect x="352" y="232" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="232" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="424" y="253" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hash inputs</text>
      <text x="424" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restore → key</text>

      <!-- Hermes: Copy in (focal) -->
      <rect x="544" y="232" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="232" width="144" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="616" y="253" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copy in</text>
      <text x="616" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cp -a · 3.5 s</text>

      <!-- Hermes: Copy out -->
      <rect x="736" y="232" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="232" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="808" y="253" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copy out</text>
      <text x="808" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">save · tmp+rename</text>

      <!-- Store: Snapshot -->
      <rect x="736" y="360" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="360" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="808" y="381" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Snapshot</text>
      <text x="808" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;key&gt;/ · 1.4 GB</text>

      <!-- Store: Evict -->
      <rect x="928" y="360" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="928" y="360" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1000" y="381" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evict</text>
      <text x="1000" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&gt;90 d · over cap</text>

      <!-- Legend -->
      <line x1="40" y1="476" x2="1080" y2="476" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="508" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="200" y="508" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="220" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="360" y="508" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="380" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fast path (cache hit)</text>

      <line x1="520" y1="513" x2="548" y2="513" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="556" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>
    </svg>
  </div>
</body>
</html>
