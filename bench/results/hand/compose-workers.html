<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One issue workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>One issue workspace</h1>

    <svg viewBox="0 0 1056 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compose-workers-title compose-workers-desc">
      <title id="compose-workers-title">One issue workspace</title>
      <desc id="compose-workers-desc">Architecture of one issue workspace: the Hermes agent calls the app-container-runner, which brings up the repo's compose services and runs commands in worker containers on a shared network, while the agent and the workers share the issue worktree.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="456" y="72" width="576" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="468" y="66" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="75" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NETWORK &lt;WS&gt;_DEFAULT</text>

      <rect x="472" y="104" width="544" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="484" y="108" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="117" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COMPOSE PROJECT &lt;WS&gt; · REPO DECLARES</text>

      <rect x="472" y="256" width="544" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="484" y="260" width="180" height="12" rx="2" fill="#f5f5f5"/>
      <text x="574" y="269" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUNNER WORKERS · RUN_PROJECT_CMD</text>

      <!-- connectors -->
      <line x1="252" y1="168" x2="252" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="252" y1="376" x2="252" y2="312" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 352,252 H 424 Q 432,252 432,244 V 180 Q 432,172 440,172 H 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 352,292 H 424 Q 432,292 432,300 V 316 Q 432,324 440,324 H 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="696" y1="172" x2="792" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="556" y1="288" x2="556" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 808,288 V 252 Q 808,244 800,244 H 644 Q 636,244 636,236 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="596" y1="360" x2="596" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="832" y1="360" x2="832" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 152,132 H 112 Q 104,132 104,140 V 508 Q 104,516 112,516 H 536" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- connector labels -->
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" letter-spacing="0.06em">
        <rect x="262" y="194" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="266" y="203">HTTP /RUN</text>
        <rect x="262" y="338" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="266" y="347">VALIDATED</text>
        <rect x="358" y="232" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="241" text-anchor="middle">COMPOSE UP</text>
        <rect x="356" y="272" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="281" text-anchor="middle">DOCKER EXEC</text>
        <rect x="730" y="152" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="161" text-anchor="middle">SQL</text>
        <rect x="684" y="224" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="722" y="233" text-anchor="middle">TETRA-API:8080</text>
        <rect x="604" y="436" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="445">MOUNT RW</text>
        <rect x="302" y="496" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="505" text-anchor="middle">EDITS</text>
      </g>

      <!-- nodes -->
      <g font-family="'Geist', sans-serif">
        <!-- Hermes agent (actor) -->
        <rect x="152" y="96" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="152" y="96" width="200" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="160" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="178" y="111" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="252" y="136" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Hermes agent</text>
        <text x="252" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">coder · checker</text>

        <!-- app-container-runner (focal) -->
        <rect x="152" y="232" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="152" y="232" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="160" y="238" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="182" y="247" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER</text>
        <text x="252" y="276" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">app-container-runner</text>
        <text x="252" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only Docker access</text>

        <!-- Compose file (note) -->
        <rect x="152" y="376" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="152" y="376" width="200" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="160" y="382" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="176" y="391" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="252" y="416" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Compose file</text>
        <text x="252" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.hermes/services.compose.yaml</text>

        <!-- tetra-api -->
        <rect x="496" y="136" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="136" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="504" y="142" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="518" y="151" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="596" y="176" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">tetra-api</text>
        <text x="596" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prebuilt image</text>

        <!-- tetra-db -->
        <rect x="792" y="136" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="136" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="800" y="142" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="812" y="151" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="892" y="176" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">tetra-db</text>
        <text x="892" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">postgres:16</text>

        <!-- Worker default -->
        <rect x="496" y="288" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="288" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="504" y="294" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="526" y="303" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="596" y="328" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Worker · default</text>
        <text x="596" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">npm test · ng serve</text>

        <!-- Worker client.test -->
        <rect x="792" y="288" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="288" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="800" y="294" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="822" y="303" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="892" y="328" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Worker · client.test</text>
        <text x="892" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cypress run</text>

        <!-- Issue worktree -->
        <rect x="536" y="480" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="480" width="320" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="544" y="486" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="566" y="495" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOLUME</text>
        <text x="696" y="520" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Issue worktree</text>
        <text x="696" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/opt/workspace · same path as Hermes</text>
      </g>

      <!-- legend -->
      <line x1="30" y1="584" x2="1026" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">
        <text x="30" y="612" letter-spacing="0.14em">LEGEND</text>
        <line x1="112" y1="609" x2="144" y2="609" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="152" y="612">call</text>
        <line x1="216" y1="609" x2="248" y2="609" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="256" y="612">HTTP call</text>
        <line x1="344" y1="609" x2="376" y2="609" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="384" y="612">data / mount</text>
        <rect x="488" y="603" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="512" y="612">only Docker access</text>
        <rect x="632" y="603" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="656" y="612">store</text>
        <rect x="712" y="603" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <text x="736" y="612">network boundary</text>
      </g>
    </svg>
  </div>
</body>
</html>
