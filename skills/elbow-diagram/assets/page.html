<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{Title}</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f5; color: #2d3142; font-family: 'Geist', system-ui, sans-serif; padding: 3rem 2rem; line-height: 1.5; }
.frame { max-width: 1100px; margin: 0 auto; }
.eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
h2 { font-size: 1rem; font-weight: 600; margin: 2.5rem 0 0.5rem; }
p { max-width: 70ch; color: #4f5d75; margin-bottom: 1rem; }
svg { display: block; max-width: 100%; height: auto; margin: 1.5rem 0; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">{Project} · {Topic}</p>
<h1>{Title}</h1>
<p>{One or two sentences: the point of the page.}</p>

<h2>{First point}</h2>
<p>{The short text this diagram supports.}</p>
<!-- elbow:overview -->
</div>
</body>
</html>
