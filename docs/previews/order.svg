<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501.88 576" width="501.88" height="576" role="img" aria-labelledby="sketch-1-title sketch-1-desc"><title id="sketch-1-title">Life of a shop order</title><desc id="sketch-1-desc">State diagram of Pending, Paid, Shipped, Delivered, Returned, Cancelled with 6 connections.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker><marker id="uml-triangle" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="1 1, 13 6, 1 11" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker><marker id="uml-diamond" markerWidth="18" markerHeight="10" refX="17" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="1 5, 9 1, 17 5, 9 9" fill="#2d3142" stroke="#2d3142" stroke-width="1"/></marker><marker id="uml-diamond-open" markerWidth="18" markerHeight="10" refX="17" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="1 5, 9 1, 17 5, 9 9" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker><marker id="uml-open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polyline points="1 1, 11 6, 1 11" fill="none" stroke="#2d3142" stroke-width="1"/></marker></defs><style>.sk-halo,.sk-outline{opacity:0}.is-pointed>.sk-halo,.is-selected>.sk-outline{opacity:1}.sk-edge.is-pointed>.sk-hit{stroke:rgba(46,90,168,0.12)}.sk